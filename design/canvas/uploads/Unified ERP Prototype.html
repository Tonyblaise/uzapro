<meta name="claude:viewport-fit-sides" content="cover">
<title>Unified ERP Prototype</title>
<style>
  /* Layout: fixed app shell — left module rail, top bar, routed content panel with sub-nav + per-tab sample screen. */
  :root{
    --bg:#f3f6f4; --panel:#ffffff; --panel-2:#eef2ef; --fg:#15211b; --muted:#5f6d66; --border:#e3eae5; --border-strong:#d2ddd6;

    --rail:#101216; --rail-2:#1d2026; --rail-fg:#c3c9d3; --rail-fg-dim:#79818e;
    --accent:#2bd58c; --accent-2:#1f9d66; --accent-soft:#143328; --on-accent:#06241a;
    --good:#2bd58c; --good-soft:#11291f; --warn:#e3a94a; --warn-soft:#2b2310; --bad:#ef6a82; --bad-soft:#2d141a; --info:#6f93ef; --info-soft:#18203a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.2); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c0d10; --panel:#15171b; --panel-2:#1d2026; --fg:#e8eaee; --muted:#99a1ad; --border:#262a31; --border-strong:#353a43;
    --rail:#101216; --rail-2:#1d2026; --rail-fg:#c3c9d3; --rail-fg-dim:#79818e;
    --accent:#2bd58c; --accent-2:#1f9d66; --accent-soft:#143328; --on-accent:#06241a;

  .tabtitle{font-family:var(--fd);font-weight:600;font-size:1.05rem;margin:0 0 12px}

  .stat{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--fm)}

  .cards2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .tablewrap{border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--panel)}
  .toverflow{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:560px}

  .cline{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px solid var(--border)}
  .cart .tot{display:flex;justify-content:space-between;font-weight:700;margin-top:10px;font-size:1.05rem}
  .chat{max-width:620px;display:flex;flex-direction:column;gap:12px}
  .ai-hero{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:16px;margin-bottom:4px;box-shadow:var(--shadow)}

  .ai-hero b{font-family:var(--fd);font-weight:600;font-size:1.02rem;display:block}

/* helpers (return HTML strings) */
const P=(t,c)=>`<span class="pill ${c}">${t}</span>`;
let TABLES=[];
function TBL(cols,rows){const ti=TABLES.length;TABLES.push({cols,rows});return `<div class="tablewrap" data-tbl="${ti}"><div class="toverflow"><table><thead><tr>${cols.map(c=>`<th${c.num?' style="text-align:right"':''}>${c.t}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr data-r="${ri}" tabindex="0">${r.map((cell,i)=>`<td class="${cols[i].num?'num':''}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function LISTVIEW(cols,rows){return `<div class="listview"><div class="toolbar"><label class="tsearch"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input class="js-search" placeholder="Search…" aria-label="Search this list"></label><span class="tsp"></span><button class="tbtn js-export">Export CSV</button></div>`+TBL(cols,rows)+`<div class="listfoot"><span class="js-count">Showing ${rows.length} of ${rows.length}</span><span>Page 1 of 1</span></div></div>`}
function STAT(items){return `<div class="stats">${items.map(s=>`<div class="stat"><div class="k">${s[0]}</div><div class="v">${s[1]}</div><div class="d ${s[3]||''}">${s[2]||''}</div></div>`).join('')}</div>`}
function BARS(v,l,alt){return `<div class="bars ${alt?'alt':''}">${v.map((x,i)=>`<div class="bar" style="height:${x}%"><span>${l[i]}</span></div>`).join('')}</div>`}
function FORM(fields){return `<div class="formgrid">${fields.map(f=>`<div class="field" ${f[3]?'style="grid-column:1/-1"':''}><label>${f[0]}</label><div class="inp ${f[2]?'ph':''}" ${f[3]?'style="min-height:72px"':''}>${f[1]}</div></div>`).join('')}</div><div class="formactions"><button class="btn-primary">Save</button><button class="ghost">Cancel</button></div>`}
function CARDS(items){return `<div class="rgrid">${items.map(r=>`<div class="rcard"><div class="ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 13V7 M8 13V3 M13 13v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><b>${r[0]}</b><p>${r[1]||'Run · schedule · export'}</p></div>`).join('')}</div>`}
function KCOL(title,color,cards){return `<div class="kcol"><h4><span class="kdot" style="background:${color}"></span>${title}</h4>${cards.map(c=>`<div class="kcard"><b>${c[0]}</b><small>${c[1]}</small></div>`).join('')}</div>`}
function KANBAN(cols){return `<div class="kan">${cols.map(c=>KCOL(c[0],c[1],c[2])).join('')}</div>`}
function render(spec){
  if(spec.k==='stats'){let h=STAT(spec.items);if(spec.charts)h+=`<div class="cards2">${spec.charts.map(c=>`<div class="card"><h3>${c.t}</h3>${BARS(c.v,c.l,c.alt)}</div>`).join('')}</div>`;if(spec.table)h+='<div style="height:16px"></div>'+TBL(spec.table.cols,spec.table.rows);return h;}
  if(spec.k==='table')return LISTVIEW(spec.cols,spec.rows);
  if(spec.k==='form')return FORM(spec.fields);
  if(spec.k==='cards')return CARDS(spec.items);
  if(spec.k==='kanban')return KANBAN(spec.cols);
  if(spec.k==='pos')return spec.html;
  if(spec.k==='chat')return spec.html;

}

function openDrawer(cols,row,crumb){
  let statusHTML='';
  row.forEach(cell=>{if(typeof cell==='string'&&cell.indexOf('class="pill')>-1&&!statusHTML)statusHTML=cell;});
  const title=String(row[0]).replace(/<[^>]+>/g,'');

}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

document.addEventListener('input',e=>{

  trs.forEach(tr=>{const match=tr.textContent.toLowerCase().includes(q);tr.style.display=match?'':'none';if(match)n++;});
  const c=lv.querySelector('.js-count');if(c)c.textContent='Showing '+n+' of '+trs.length;
});
document.addEventListener('click',e=>{

  if(e.target.closest('.js-new')){const id=(location.hash.slice(1).split('-')[0])||'home';openCreate(MODS.find(x=>x.id===id)||MODS[0]);return;}
  const tr=e.target.closest('tr[data-r]');if(!tr)return;
  const wrap=tr.closest('[data-tbl]');if(!wrap)return;
  const t=TABLES[+wrap.dataset.tbl];if(!t)return;
  const id=(location.hash.slice(1).split('-')[0])||'home';
  openDrawer(t.cols,t.rows[+tr.dataset.r],(MODS.find(x=>x.id===id)||MODS[0]).n);
});

/* ---------- render ---------- */
const nav=document.getElementById('nav'),content=document.getElementById('content');
let lastSec=null;
MODS.forEach(m=>{
  if(m.sec!==lastSec){const s=document.createElement('div');s.className='nav-sec';s.textContent=m.sec;nav.appendChild(s);lastSec=m.sec;}
  const b=document.createElement('button');b.className='nitem';b.dataset.id=m.id;
  b.innerHTML=`<svg viewBox="0 0 18 18">${m.ic}</svg>${m.n}`;
  b.onclick=()=>{route(m.id,0);document.body.classList.remove('navopen');};
  nav.appendChild(b);
});
function route(id,tabIdx){
  const m=MODS.find(x=>x.id===id)||MODS[0];
  tabIdx=tabIdx||0;
  document.querySelectorAll('.nitem').forEach(n=>n.classList.toggle('active',n.dataset.id===m.id));
  const tabsHtml=m.tabs.map((t,i)=>`<button class="subtab ${i===tabIdx?'active':''}" data-i="${i}">${t.t}</button>`).join('');
  content.innerHTML=`
    <div class="phead"><div class="psp"><p class="crumb">${m.sec} / ${m.n}</p><h1 class="ptitle">${m.n}</h1><p class="psub">${m.sub}</p></div><button class="btn-primary js-new">+ New</button></div>
    <div class="subtabs">${tabsHtml}</div>
    <h2 class="tabtitle">${m.tabs[tabIdx].t}</h2>
    <div class="note">Example data · click any row to open the record</div>
    <div id="viewbody">${renderBody(m.tabs[tabIdx].s)}</div>`;
  content.querySelectorAll('.subtab').forEach(tb=>tb.onclick=()=>{
    const i=+tb.dataset.i;
    content.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));tb.classList.add('active');
    document.querySelector('.tabtitle').textContent=m.tabs[i].t;
    document.getElementById('viewbody').innerHTML=renderBody(m.tabs[i].s);
    if(location.hash.slice(1)!==m.id+'-'+i) history.replaceState(null,'',`#${m.id}-${i}`);
  });
  content.scrollTop=0;
  if(location.hash.slice(1)!==m.id+'-'+tabIdx) history.replaceState(null,'',`#${m.id}-${tabIdx}`);
}
document.getElementById('hamb').onclick=()=>document.body.classList.toggle('navopen');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('navopen');
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');};
function parseHash(){const h=location.hash.slice(1);if(!h)return['home',0];const[id,i]=h.split('-');if(MODS.some(m=>m.id===id))return[id,+i||0];return['home',0];}
const [sid,sidx]=parseHash();route(sid,sidx);
addEventListener('hashchange',()=>{const[id,i]=parseHash();route(id,i);});
</script>
